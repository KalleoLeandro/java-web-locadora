<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="corpo">
		<title>Resumo Financeiro</title>

		<h:form>
			<p:growl id="growl" showDetail="true" life="4000" />

			<script type="text/javascript">
				function financeBarExtender() {
					this.cfg.seriesDefaults = {
						rendererOptions : {
							varyBarColor : true
						}
					};
				}
			</script>

			<p:tabView>
				<p:tab id="resumo" title="Resumo Financeiro">
					<p:panel header="Indicadores Graficos" rendered="#{resumeBacking.render}">
						<h:panelGrid columns="1" cellpadding="10" style="width:100%;">
							<p:chart type="bar" model="#{resumeBacking.lucroMensalModel}" style="width:100%;height:340px" />
							<p:chart type="bar" model="#{resumeBacking.lucroAnualModel}" style="width:100%;height:340px" />
							<p:chart type="pie" model="#{resumeBacking.locacoesPorCategoriaModel}" style="width:100%;height:420px" />
						</h:panelGrid>
					</p:panel>

					<p:outputPanel rendered="#{!resumeBacking.render}">
						<h:outputText value="Nao ha dados suficientes para exibir o resumo financeiro." />
					</p:outputPanel>
				</p:tab>
			</p:tabView>
		</h:form>
	</ui:define>

</ui:composition>
