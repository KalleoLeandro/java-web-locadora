<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Locadora Kalleo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#12345a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29d7ff"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#29d7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="708" height="208" rx="34" fill="url(#bg)"/>
  <rect x="6" y="6" width="708" height="208" rx="34" fill="none" stroke="#1f5c93" stroke-width="2"/>

  <g transform="translate(34 34)">
    <rect x="0" y="0" width="152" height="152" rx="30" fill="#0c1d34" stroke="#2ccfff" stroke-width="3"/>
    <circle cx="76" cy="76" r="52" fill="#081221" stroke="url(#accent)" stroke-width="8"/>
    <path d="M33 92c9-30 30-46 61-46 32 0 53 16 62 46" fill="none" stroke="#dff7ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="78" r="8" fill="#29d7ff"/>
    <circle cx="98" cy="78" r="8" fill="#29d7ff"/>
    <path d="M67 106h18" stroke="#ffd54f" stroke-width="8" stroke-linecap="round"/>
    <path d="M123 52v26M110 65h26" stroke="#ffd54f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="33" cy="56" r="10" fill="#7c4dff"/>
    <circle cx="33" cy="96" r="10" fill="#ff5c93"/>
    <rect x="53" y="22" width="46" height="10" rx="5" fill="url(#accent2)" opacity="0.9"/>
  </g>

  <g transform="translate(216 45)">
    <text x="0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fbff">LOCADORA</text>
    <text x="0" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="900" fill="url(#accent)" filter="url(#glow)">KALLEO</text>
    <text x="2" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="3" fill="#9fd8ff">GAMES • CONSOLES • RETRO</text>
    <rect x="0" y="170" width="280" height="8" rx="4" fill="url(#accent2)" opacity="0.85"/>
  </g>

  <g opacity="0.16">
    <circle cx="650" cy="48" r="22" fill="#29d7ff"/>
    <circle cx="618" cy="74" r="12" fill="#ffd54f"/>
    <circle cx="676" cy="84" r="10" fill="#7c4dff"/>
    <rect x="610" y="140" width="70" height="18" rx="9" fill="#ffffff"/>
    <rect x="634" y="116" width="22" height="66" rx="11" fill="#ffffff"/>
  </g>
</svg>
